name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m compileall -q backend
      - run: docker compose config
        env:
          STATS_TOKEN: ci-placeholder-not-for-production
          IP_SALT: ci-placeholder-not-for-production
