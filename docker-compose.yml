services:
  site:
    build: .
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  articles:
    build:
      context: .
      dockerfile: articles/Dockerfile
    ports:
      - "3001:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/telemetry.db
      - STATS_TOKEN=${STATS_TOKEN:?STATS_TOKEN must be set in .env}
      - IP_SALT=${IP_SALT:?IP_SALT must be set in .env}
      - PDF_CONCURRENCY=${PDF_CONCURRENCY:-2}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
