version: '3.8'

services:
  site:
    build: .
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/telemetry.db
      - STATS_TOKEN=${STATS_TOKEN:-changeme-please}
      - IP_SALT=${IP_SALT:-change-me-please}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
